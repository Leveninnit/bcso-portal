<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subdivision Applications — BCSO</title>
  <meta name="description" content="Apply to a Blaine County Sheriff's Office subdivision: TEU, OCD, NRED, or RTD." />
  <link rel="icon" type="image/png" href="assets/bcso-crest.png" />
  <link rel="apple-touch-icon" href="assets/bcso-crest.png" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="site-header-mount"></div>
  <main>
    <section>
      <div class="container">
        <div class="breadcrumb"><a href="index.html">Home</a> / Applications</div>
        <h1 class="page-title">Subdivision Applications</h1>
        <p class="page-sub">
          Select a subdivision below to view its requirements and submit an
          application. Your application is sent directly to command staff
          &mdash; you'll hear back on Discord.
        </p>
<div class="quick-links">
<span class="quick-links-label">Jump to</span>
<a class="quick-link" href="activity-log.html"><span class="quick-link-icon">🪪</span>Activity Log</a>
<a class="quick-link" href="documents.html"><span class="quick-link-icon">📄</span>Documents</a>
<a class="quick-link" href="leaderboards.html"><span class="quick-link-icon">🏆</span>Leaderboards</a>
<a class="quick-link" href="team.html"><span class="quick-link-icon">⭐</span>Meet the Team</a>
<a class="quick-link" href="command-access.html"><span class="quick-link-icon">🔒</span>Command Access</a>
</div>
        <div id="sub-grid" class="sub-grid">
          <!-- populated by JS from assets/subdivisions.js -->
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer-mount"></div>
  <script src="assets/subdivisions.js"></script>
  <script src="assets/main.js"></script>
  <script>
    function renderCards() {
      const grid = document.getElementById("sub-grid");
      // SRT is an activity-log-only subdivision (no public application form),
      // so it's excluded from this page — see assets/subdivisions.js.
      grid.innerHTML = SUBDIVISIONS.filter((s) => !s.logOnly).map((s) => `
        <div class="panel sub-card">
          <span class="badge-tag">${s.short}</span>
          <h3>${s.name}</h3>
          <p>${s.description}</p>
          <a class="btn btn-gold" href="apply.html?div=${encodeURIComponent(s.slug)}">Apply Now</a>
        </div>
      `).join("");
    }
    document.addEventListener("DOMContentLoaded", renderCards);
  </script>
</body>
</html>
