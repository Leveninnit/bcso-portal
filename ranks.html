<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranks — BCSO</title>
<meta name="description" content="Rank structure for every Blaine County Sheriff's Office subdivision." />
<link rel="icon" type="image/png" href="assets/bcso-crest.png" />
<link rel="apple-touch-icon" href="assets/bcso-crest.png" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div id="site-header-mount"></div>
<main>
<section>
<div class="container">
<div class="breadcrumb"><a href="index.html">Home</a> / Ranks</div>
<h1 class="page-title">Ranks</h1>
<p class="page-sub">
Rank structure for each subdivision, highest to lowest, kept up to
date by that subdivision's own command staff in Command Access. The
Roster on each subdivision's Documents page is automatically sorted
using this same order.
</p>
<div id="ranks-grid" class="sub-grid">
<!-- populated by JS -->
</div>
</div>
</section>
</main>
<div id="site-footer-mount"></div>
<script src="assets/subdivisions.js"></script>
<script src="assets/main.js"></script>
<script src="assets/effects.js"></script>
<script>
function escapeHtml(str) {
  return (str ?? "").toString().replace(/[&<>"']/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[c]));
}

async function loadRanksForSubdivision(sub) {
  if (sub.slug === "rtd") {
    return `<p class="rank-empty">RTD's ranks are managed separately as part of its training program, and aren't configured through this list.</p>`;
  }
  try {
    const res = await fetch(`/api/rank-options?div=${encodeURIComponent(sub.slug)}`, { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    const options = data.options || [];
    if (!options.length) {
      return `<p class="rank-empty">No ranks configured yet for ${escapeHtml(sub.short)}.</p>`;
    }
    return `
      <ol class="rank-list">
        ${options.map((label) => `<li><span class="rank-name">${escapeHtml(label)}</span></li>`).join("")}
      </ol>
    `;
  } catch {
    return `<p class="rank-empty">Couldn't load ranks. Try refreshing.</p>`;
  }
}

async function renderRanksPage() {
  const grid = document.getElementById("ranks-grid");
  const subs = window.SUBDIVISIONS || [];
  grid.innerHTML = subs
    .map(
      (s) => `
    <div class="panel rank-card">
      <span class="badge-tag">${escapeHtml(s.short)}</span>
      <h3>${escapeHtml(s.name)}</h3>
      <div class="rank-card-body" id="rank-body-${escapeHtml(s.slug)}">Loading…</div>
    </div>
  `
    )
    .join("");

  await Promise.all(
    subs.map(async (s) => {
      const html = await loadRanksForSubdivision(s);
      const body = document.getElementById(`rank-body-${s.slug}`);
      if (body) body.innerHTML = html;
    })
  );
}

document.addEventListener("DOMContentLoaded", renderRanksPage);
</script>
</body>
</html>
