<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roster — BCSO</title>
<meta name="description" content="Subdivision roster — ranks, badge numbers, and status for every member." />
<link rel="icon" type="image/png" href="assets/bcso-crest.png" />
<link rel="apple-touch-icon" href="assets/bcso-crest.png" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div id="site-header-mount"></div>
<main>
<section>
<div class="container roster-container">
<div class="breadcrumb" id="roster-breadcrumb"><a href="index.html">Home</a> / Roster</div>
<h1 class="page-title" id="roster-title">Roster</h1>
<p class="page-sub" id="roster-subtitle">Current members, kept up to date by command staff.</p>
<p class="page-sub" id="roster-last-updated" style="display:none;"></p>
<div id="roster-grid"></div>
</div>
</section>
</main>
<div id="site-footer-mount"></div>
<script src="assets/subdivisions.js"></script>
<script src="assets/main.js"></script>
<script src="assets/effects.js"></script>
<script>
function getQueryParam(name) {
return new URLSearchParams(window.location.search).get(name);
}
function findSubdivision(slug) {
return (window.SUBDIVISIONS || []).find((s) => s.slug === slug);
}
function escapeHtml(str) {
return (str ?? "").toString().replace(/[&<>"']/g, (c) => ({
"&": "&amp;",
"<": "&lt;",
">": "&gt;",
'"': "&quot;",
"'": "&#39;",
}[c]));
}
// Department Status pill — resolved server-side from the Master Roster's
// own "Status" column by badge number, never typed in manually (see
// functions/api/roster.js).
function statusPillClass(status) {
const s = (status || "").toLowerCase();
if (/inactive|terminated|resign/.test(s)) return "status-inactive";
if (/loa|leave/.test(s)) return "status-loa";
if (/active/.test(s)) return "status-active";
return "status-unknown";
}
function renderStatusCell(status) {
if (!status) return `<span class="rt-empty">&mdash;</span>`;
return `<span class="status-pill ${statusPillClass(status)}">${escapeHtml(status)}</span>`;
}
// Activity Level pill — computed from THIS MONTH's Activity Log
// submissions for the person's badge number (see activityLevelFor in
// functions/api/roster.js), not from Department Status. Reuses the same
// green/gold/red pill styling as the status pill above. "Exempt" means
// this person's rank was marked exempt from the activity requirement
// (Command Access -> this subdivision -> Ranks) — it overrides the
// computed rating entirely, so it gets its own neutral pill style
// instead of borrowing green/gold/red.
function activityPillClass(level) {
if (level === "Exempt") return "status-exempt";
if (level === "Active") return "status-active";
if (level === "Semi-Active") return "status-loa";
return "status-inactive";
}
function renderActivityCell(level) {
return `<span class="status-pill ${activityPillClass(level)}">${escapeHtml(level || "Inactive")}</span>`;
}
// Click-to-copy — Badge #, Name, and Discord ID cells only (the three
// columns someone's most likely to paste elsewhere, e.g. into Discord or
// a spreadsheet). Cells with nothing to copy (empty Discord ID, a name
// that couldn't be resolved from the Master Roster) are left inert.
// `truncate` adds the same fixed-width ellipsis treatment as the Rank
// cell (see renderTruncatedCell) -- the title attribute carries the full
// value so it's still readable on hover even when the column's too
// narrow to show it in full, and clicking still copies the untruncated
// value regardless of what's visible.
function copyableCell(value, extraClass, truncate) {
const safe = escapeHtml(value || "");
const cls = ["rt-copyable", extraClass, truncate ? "rt-truncate" : ""].filter(Boolean).join(" ");
if (!value) return `<td class="${cls}">${`<span class="rt-empty">&mdash;</span>`}</td>`;
const title = truncate ? `${safe} — click to copy` : "Click to copy";
return `<td class="${cls} rt-copyable-active" data-copy="${safe}" title="${title}">${safe}</td>`;
}
// Rank isn't copyable, but with the table now fixed-width (see the
// roster-table CSS -- this replaced the old overflow-x:auto scrollbar so
// the roster fits the page without horizontal scrolling), rank names can
// still be longer than their column. Same ellipsis + title-on-hover
// treatment as the truncate option above. Pass noTruncate for a column
// (Rank) that should never show "…" — it wraps onto a second line
// instead (see .roster-table td.rt-rank in style.css), and the page's
// container is widened for this page specifically (.roster-container)
// so that's rarely even needed.
function renderTruncatedCell(value, extraClass, noTruncate) {
const safe = escapeHtml(value || "");
const cls = [noTruncate ? "" : "rt-truncate", extraClass].filter(Boolean).join(" ");
if (!value) return `<td class="${cls}"><span class="rt-empty">&mdash;</span></td>`;
return `<td class="${cls}" title="${safe}">${safe}</td>`;
}
function setupCopyableCells(root) {
root.querySelectorAll(".rt-copyable-active").forEach((cell) => {
cell.addEventListener("click", async (event) => {
const value = cell.dataset.copy;
if (!value) return;
// Easter egg: click the SAME cell 10 times (counted per-cell, so
// clicking other cells in between doesn't interfere or carry over)
// and it throws a little BCSO-crest confetti party at the cursor.
// Counts every click on a cell with a value, not just ones that
// successfully copy, so it can't get stuck on a clipboard failure.
cell._copyClickCount = (cell._copyClickCount || 0) + 1;
if (cell._copyClickCount >= 10) {
cell._copyClickCount = 0;
triggerCopyPartyEasterEgg(event.clientX, event.clientY);
}
try {
await navigator.clipboard.writeText(value);
} catch {
// Clipboard API unavailable/blocked (e.g. no HTTPS context, denied
// permission) — fail quietly rather than alert-spamming on a click
// that also runs on ordinary text-selection drags across the cell.
return;
}
clearTimeout(cell._copyTimeout);
if (cell._copyOriginal === undefined) cell._copyOriginal = cell.innerHTML;
cell.classList.add("rt-copied");
cell.textContent = "Copied!";
cell._copyTimeout = setTimeout(() => {
cell.innerHTML = cell._copyOriginal;
cell.classList.remove("rt-copied");
}, 1100);
});
});
}

// ---------------------------------------------------------------------
// Copy-10-times easter egg: a synthesized party fanfare (Web Audio —
// no audio file to host/fetch) plus a BCSO-crest confetti explosion
// (canvas overlay) bursting from the cursor. Self-contained to this
// page; nothing here is loaded unless someone actually finds it.
// ---------------------------------------------------------------------
let _partyAudioCtx = null;
function getPartyAudioCtx() {
if (!_partyAudioCtx) {
const Ctx = window.AudioContext || window.webkitAudioContext;
if (!Ctx) return null;
_partyAudioCtx = new Ctx();
}
if (_partyAudioCtx.state === "suspended") _partyAudioCtx.resume();
return _partyAudioCtx;
}
function playPartyFanfare() {
const ctx = getPartyAudioCtx();
if (!ctx) return;
const now = ctx.currentTime;
// A quick bright ascending arpeggio (C5-E5-G5-C6-E6) — the "ta-da".
const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
notes.forEach((freq, i) => {
const start = now + i * 0.075;
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = i % 2 ? "triangle" : "square";
osc.frequency.setValueAtTime(freq, start);
gain.gain.setValueAtTime(0, start);
gain.gain.linearRampToValueAtTime(0.22, start + 0.015);
gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.4);
osc.connect(gain).connect(ctx.destination);
osc.start(start);
osc.stop(start + 0.42);
});
// A final held major chord for a triumphant landing.
const chordStart = now + notes.length * 0.075 + 0.05;
[523.25, 659.25, 783.99, 1046.5].forEach((freq) => {
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = "sawtooth";
osc.frequency.setValueAtTime(freq, chordStart);
gain.gain.setValueAtTime(0, chordStart);
gain.gain.linearRampToValueAtTime(0.12, chordStart + 0.03);
gain.gain.exponentialRampToValueAtTime(0.0006, chordStart + 0.8);
const lp = ctx.createBiquadFilter();
lp.type = "lowpass";
lp.frequency.value = 3200;
osc.connect(lp).connect(gain).connect(ctx.destination);
osc.start(chordStart);
osc.stop(chordStart + 0.85);
});
// A short filtered noise "pop", like a party popper going off.
const popStart = now;
const bufferSize = Math.floor(ctx.sampleRate * 0.18);
const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
const noise = ctx.createBufferSource();
noise.buffer = buffer;
const noiseFilter = ctx.createBiquadFilter();
noiseFilter.type = "highpass";
noiseFilter.frequency.value = 1200;
const noiseGain = ctx.createGain();
noiseGain.gain.setValueAtTime(0.35, popStart);
noiseGain.gain.exponentialRampToValueAtTime(0.0006, popStart + 0.18);
noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
noise.start(popStart);
}

let _confettiCanvas = null;
let _confettiCtx = null;
let _confettiParticles = [];
let _confettiRAF = null;
let _crestImg = null;
function ensureConfettiCanvas() {
if (_confettiCanvas) return;
_confettiCanvas = document.createElement("canvas");
_confettiCanvas.style.cssText =
"position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:99999;";
document.body.appendChild(_confettiCanvas);
_confettiCtx = _confettiCanvas.getContext("2d");
const resize = () => {
const dpr = window.devicePixelRatio || 1;
_confettiCanvas.width = window.innerWidth * dpr;
_confettiCanvas.height = window.innerHeight * dpr;
_confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
};
resize();
window.addEventListener("resize", resize);
_crestImg = new Image();
_crestImg.src = "assets/bcso-crest.png";
}
const PARTY_COLORS = ["#c9a227", "#e6c65c", "#2c5c3a", "#4caf7d", "#c7cdd1"];
function burstConfetti(x, y) {
ensureConfettiCanvas();
// A quick expanding gold ring flash at the origin, for a satisfying
// "pop" moment underneath the confetti burst.
_confettiParticles.push({ type: "ring", x, y, radius: 4, life: 1 });
const count = 70;
for (let i = 0; i < count; i++) {
const angle = Math.random() * Math.PI * 2;
const speed = 4.5 + Math.random() * 10;
const isLogo = Math.random() < 0.65;
_confettiParticles.push({
type: "piece",
x,
y,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed - 4.5, // upward bias so it "explodes" up and out
rotation: Math.random() * Math.PI * 2,
vr: (Math.random() - 0.5) * 0.4,
size: isLogo ? 16 + Math.random() * 16 : 6 + Math.random() * 7,
isLogo,
color: PARTY_COLORS[(Math.random() * PARTY_COLORS.length) | 0],
life: 1,
decay: 0.007 + Math.random() * 0.011,
});
}
if (!_confettiRAF) _confettiRAF = requestAnimationFrame(stepConfetti);
}
function stepConfetti() {
_confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
_confettiCtx.shadowColor = "rgba(0,0,0,0.4)";
_confettiCtx.shadowBlur = 5;
_confettiParticles = _confettiParticles.filter((p) => p.life > 0);
for (const p of _confettiParticles) {
if (p.type === "ring") {
p.radius += 6.5;
p.life -= 0.045;
_confettiCtx.save();
_confettiCtx.shadowBlur = 0;
_confettiCtx.globalAlpha = Math.max(p.life, 0) * 0.8;
_confettiCtx.strokeStyle = "#e6c65c";
_confettiCtx.lineWidth = 3;
_confettiCtx.beginPath();
_confettiCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
_confettiCtx.stroke();
_confettiCtx.restore();
continue;
}
p.vy += 0.2; // gravity
p.vx *= 0.99; // air drag
p.x += p.vx;
p.y += p.vy;
p.rotation += p.vr;
p.life -= p.decay;
_confettiCtx.save();
_confettiCtx.globalAlpha = Math.max(p.life, 0);
_confettiCtx.translate(p.x, p.y);
_confettiCtx.rotate(p.rotation);
if (p.isLogo && _crestImg && _crestImg.complete && _crestImg.naturalWidth) {
_confettiCtx.drawImage(_crestImg, -p.size / 2, -p.size / 2, p.size, p.size);
} else {
_confettiCtx.fillStyle = p.color;
_confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
}
_confettiCtx.restore();
}
if (_confettiParticles.length) {
_confettiRAF = requestAnimationFrame(stepConfetti);
} else {
_confettiRAF = null;
_confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}
}
function triggerCopyPartyEasterEgg(x, y) {
playPartyFanfare();
burstConfetti(x, y);
}
// Same "D1's datetime('now') is UTC without a 'Z'" handling as
// assets/leaderboards.js's formatDate.
function formatDate(value) {
if (!value) return "";
const iso = value.includes("T") ? value : value.replace(" ", "T") + "Z";
const d = new Date(iso);
if (isNaN(d.getTime())) return value;
return d.toLocaleString(undefined, {
year: "numeric",
month: "short",
day: "numeric",
hour: "numeric",
minute: "2-digit",
});
}
function renderLastUpdated(lastUpdated) {
const el = document.getElementById("roster-last-updated");
if (!lastUpdated || !lastUpdated.at) {
el.style.display = "none";
return;
}
el.textContent = `Last updated ${formatDate(lastUpdated.at)} by ${lastUpdated.by}.`;
el.style.display = "";
}
async function loadRoster(sub) {
const grid = document.getElementById("roster-grid");
grid.innerHTML = "Loading…";
try {
const res = await fetch(`/api/roster?div=${encodeURIComponent(sub.slug)}`, { cache: "no-store" });
const data = await res.json().catch(() => ({}));
const entries = data.entries || [];
renderLastUpdated(data.lastUpdated);
if (!entries.length) {
document.getElementById("roster-subtitle").textContent =
`No roster entries yet for ${sub.short} — command staff can add some from Command Access.`;
grid.innerHTML = "";
return;
}
document.getElementById("roster-subtitle").textContent =
`${entries.length} member${entries.length === 1 ? "" : "s"} on the current ${sub.short} roster, kept up to date by command staff.`;
const rows = entries
.map(
(e) => `
<tr>
${renderTruncatedCell(e.rank, "rt-rank", true)}
${copyableCell(e.badgeNumber)}
${e.characterName ? copyableCell(e.characterName, "rt-name", true) : `<td class="rt-name rt-truncate"><span class="rt-empty">Not on Master Roster</span></td>`}
${copyableCell(e.discordId, "rt-discord", true)}
<td class="rt-truncate">${renderStatusCell(e.departmentStatus)}</td>
<td class="rt-num">${e.hoursLogged || 0}</td>
<td class="rt-num">${e.activations || 0}</td>
<td class="rt-truncate">${renderActivityCell(e.activityLevel)}</td>
<td class="rt-notes">${e.notes ? escapeHtml(e.notes) : ""}</td>
</tr>
`
)
.join("");
// Fixed-width columns (see .roster-table's table-layout:fixed in
// style.css) so the whole table always fits the page width instead of
// needing the horizontal scrollbar the old auto-width table forced on
// desktop. Percentages sum to 100. Rank gets a wider share than the
// others (and the page's .roster-container is itself wider than the
// site's usual container) so full rank titles fit without wrapping in
// the common case -- it's also the one column that never ellipsizes
// even if it does wrap (see renderTruncatedCell's noTruncate above).
grid.innerHTML = `
<div class="roster-table-wrap">
<table class="roster-table">
<colgroup>
<col style="width:16%">
<col style="width:6%">
<col style="width:12%">
<col style="width:11%">
<col style="width:11%">
<col style="width:6%">
<col style="width:8%">
<col style="width:11%">
<col style="width:19%">
</colgroup>
<thead>
<tr>
<th>Rank</th>
<th>Badge #</th>
<th>Name</th>
<th>Discord ID</th>
<th>Department Status</th>
<th>Hours</th>
<th>Activations</th>
<th>Activity</th>
<th>Notes</th>
</tr>
</thead>
<tbody>${rows}</tbody>
</table>
</div>
`;
setupCopyableCells(grid);
} catch {
grid.innerHTML = `<p style="color: var(--muted);">Couldn't load the roster. Try refreshing.</p>`;
}
}
function renderRosterPage(sub) {
document.getElementById("roster-breadcrumb").innerHTML =
`<a href="index.html">Home</a> / <a href="documents.html?div=${encodeURIComponent(sub.slug)}">${escapeHtml(sub.name)} Documents</a> / Roster`;
document.getElementById("roster-title").textContent = sub.short + " Roster";
document.title = sub.short + " Roster — BCSO";
loadRoster(sub);
}
function renderMissingSubdivision() {
document.getElementById("roster-title").textContent = "Roster";
document.getElementById("roster-subtitle").innerHTML =
`Pick a subdivision from <a href="documents.html">Master Documents</a> to view its roster.`;
}
document.addEventListener("DOMContentLoaded", () => {
const slug = getQueryParam("div");
const sub = slug ? findSubdivision(slug) : null;
if (sub) {
renderRosterPage(sub);
} else {
renderMissingSubdivision();
}
});
</script>
</body>
</html>
